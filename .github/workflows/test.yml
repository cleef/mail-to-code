name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
  native-sandbox-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare pinned native CLIs and Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gh
          # Ephemeral CI VM only. No service-host policy is changed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install --prefix "$RUNNER_TEMP/native-cli" --no-audit --no-fund @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.296
          echo "$RUNNER_TEMP/native-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify native filesystem, Git, gh and local network boundaries
        # Synthetic child-process probes, no model login, mail or real external effects.
        shell: bash
        run: |
          node scripts/verify-async-sandbox.mjs | tee "$RUNNER_TEMP/native-sandbox-report.json"
          test -s "$RUNNER_TEMP/native-sandbox-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-sandbox-report-${{ github.event_name }}
          path: ${{ runner.temp }}/native-sandbox-report.json
