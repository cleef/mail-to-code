name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
  project-checks-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare sandbox and isolated test images
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          # Ephemeral CI VM: permit the user namespaces required by both OS
          # sandboxes and rootless Podman. No service-host policy is changed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install --global @openai/codex@0.159.2
          # setup-node uses /opt, outside the existing minimal filesystem policy.
          # Prepare the public tools under an allowed system path; keep the
          # sandbox unchanged rather than exposing the hosted tool cache.
          sudo cp -a "$(dirname "$(dirname "$(command -v node)")")" /usr/local/mail-check-node
          echo /usr/local/mail-check-node/bin >> "$GITHUB_PATH"
          podman pull mcr.microsoft.com/playwright:v1.63.0-noble
          podman pull docker.io/library/mysql:8.4
          echo "CHECKS_BROWSER_IMAGE=$(podman image inspect mcr.microsoft.com/playwright:v1.63.0-noble --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
          echo "CHECKS_MYSQL_IMAGE=$(podman image inspect docker.io/library/mysql:8.4 --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Run real sandbox, MySQL and Chromium acceptance
        run: node scripts/verify-project-checks.mjs
